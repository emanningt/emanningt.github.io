<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Demo Playbook · Protected</title><style>:root{--b:#f5f5f7;--c:#fff;--i:#1d1d1f;--m:#6e6e73;--a:#0071e3;--l:#d2d2d7;--e:#b42318}@media(prefers-color-scheme:dark){:root{--b:#000;--c:#1c1c1e;--i:#f5f5f7;--m:#a1a1a6;--a:#2997ff;--l:#3a3a3c;--e:#ff6961}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--b);color:var(--i);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;padding:24px}main{width:min(100%,420px);background:var(--c);border-radius:24px;padding:28px;box-shadow:0 12px 40px #0002}.k{color:var(--a);font-weight:700;margin:0 0 6px}h1{font-size:30px;line-height:1.08;margin:0 0 10px}p{color:var(--m);margin:0 0 20px}label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}input{width:100%;font:inherit;background:transparent;color:var(--i);border:1px solid var(--l);border-radius:12px;padding:12px 14px}button{width:100%;border:0;border-radius:12px;padding:12px 14px;margin-top:12px;font:inherit;font-weight:700;background:var(--a);color:#fff}#s{min-height:22px;margin:10px 0 0;font-size:13px;color:var(--e)}.x{font-size:12px;margin:18px 0 0}</style></head><body><main><p class="k">Motion Edition</p><h1>Demo Playbook</h1><p>Enter the shared password to open the guide.</p><form id="f"><label for="p">Password</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus><button id="u">Open guide</button><div id="s" role="status"></div></form><p class="x">The guide is encrypted and decrypts only in your browser after the correct password is entered.</p></main><script src="./motion-20261023.js"></script>
<script>
(() => {
'use strict';
const STORE = 'siri-demo-access-v1';
const form = document.getElementById('f');
const input = document.getElementById('p');
const button = document.getElementById('u');
const status = document.getElementById('s');
const bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
let data;
function savedPassword(){try{return localStorage.getItem(STORE);}catch{return null;}}
function forgetPassword(){try{localStorage.removeItem(STORE);}catch{}}
function busy(on, text){button.disabled=on;button.textContent=text;}
async function openGuide(password,remember){
  if (!window.crypto?.subtle) throw new Error('Open this guide in a current browser over HTTPS.');
  if (typeof window.prepareDemoMotion !== 'function') throw new Error('The animation files could not load. Refresh and try again.');
  if (!data){
    const response = await fetch('./guide-data-28cbfc.html',{cache:'force-cache'});
    if (!response.ok) throw new Error('The guide could not load. Check your connection and refresh.');
    const source = await response.text();
    const match = source.match(/const D=\{s:"([^"]+)",v:"([^"]+)",c:"([^"]+)",n:(\d+)\}/);
    if (!match) throw new Error('The guide data is unavailable. Refresh and try again.');
    data = {s:match[1],v:match[2],c:match[3],n:Number(match[4])};
  }
  const material = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(data.s),iterations:data.n,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(data.v)},key,bytes(data.c));
  const html = window.prepareDemoMotion(new TextDecoder().decode(plain));
  if (remember){try{localStorage.setItem(STORE,password);}catch{}}
  document.open();document.write(html);document.close();
}
function failed(error,automatic){
  if(error.name==='OperationError'){
    if(automatic)forgetPassword();
    status.textContent=automatic?'Please enter the password again.':'Incorrect password. Please try again.';
  }else{
    status.textContent=error.message||'Could not open the guide. Check your connection and refresh.';
  }
  busy(false,'Open guide');
}
form.addEventListener('submit',async event=>{
  event.preventDefault();status.textContent='';busy(true,'Opening…');
  try{await openGuide(input.value.trim(),true);}catch(error){failed(error,false);input.select();}
});
const saved=savedPassword();
if(saved){busy(true,'Opening saved guide…');openGuide(saved,false).catch(error=>failed(error,true));}
})();
</script></body></html>
